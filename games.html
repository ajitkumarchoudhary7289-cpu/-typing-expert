
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>Balloon Typing | AJIT TYPING EXPERT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#050b18;color:white;min-height:100vh}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#081426;border-bottom:1px solid #163957}
.logo{font-weight:bold;color:#00c8ff;font-size:19px}
a{color:#00c8ff;text-decoration:none}
main{max-width:1000px;margin:auto;padding:20px}
h1{text-align:center;margin:15px 0;color:#00c8ff}
.subtitle{text-align:center;color:#9caec5;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:#10223a;padding:15px;border-radius:10px;text-align:center}
.stat strong{display:block;color:#00d4ff;font-size:24px;margin-bottom:5px}
.stat small{color:#b2c3d8}
#game{
height:420px;
background:linear-gradient(#071e3b,#104a73);
border:2px solid #1479b9;
border-radius:15px;
position:relative;
overflow:hidden;
}
.balloon{
position:absolute;
width:76px;
height:91px;
border-radius:50% 50% 45% 45%;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
font-weight:bold;
color:white;
text-shadow:1px 2px 3px black;
box-shadow:inset -8px -8px 12px #0005;
cursor:pointer;
}
.balloon:after{
content:"";
position:absolute;
bottom:-17px;
left:35px;
width:2px;
height:18px;
background:#ddd;
}
#input{
width:100%;
padding:15px;
margin-top:15px;
background:#09182a;
border:1px solid #1676b2;
border-radius:9px;
color:white;
font-size:18px;
outline:none;
}
.buttons{text-align:center;margin-top:15px}
button{
padding:12px 25px;
border:0;
border-radius:8px;
background:linear-gradient(90deg,#007bff,#00d4ff);
color:white;
font-weight:bold;
cursor:pointer;
margin:5px;
}
#message{text-align:center;margin-top:15px;color:#00d4ff}
#gameOver{
display:none;
position:absolute;
inset:0;
background:#04101beF;
z-index:10;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
text-align:center;
}
#gameOver h2{font-size:32px;color:#00d4ff}
.hint{text-align:center;color:#9caec5;font-size:13px;margin-top:12px}
@media(max-width:600px){
.stats{grid-template-columns:repeat(2,1fr)}
#game{height:400px}
}
</style>
</head>

<body>

<header>
<div class="logo">AJIT TYPING EXPERT</div>
<a href="index.html">← Home</a>
</header>

<main>
<h1>🎈 BALLOON TYPING</h1>
<p class="subtitle">Type the words and pop the balloons!</p>

<div class="stats">
<div class="stat"><strong id="score">0</strong><small>SCORE</small></div>
<div class="stat"><strong id="time">60</strong><small>TIME</small></div>
<div class="stat"><strong id="lives">❤️❤️❤️</strong><small>LIVES</small></div>
<div class="stat"><strong id="combo">0</strong><small>COMBO</small></div>
</div>

<div id="game">
<div id="gameOver">
<h2>GAME OVER!</h2>
<h3>Your Score: <span id="finalScore">0</span></h3>
<p id="finalMessage">Great Job!</p>
<button onclick="restartGame()">PLAY AGAIN</button>
</div>
</div>

<input id="input" type="text" placeholder="Type balloon words here..." autocomplete="off" disabled>

<div class="buttons">
<button id="start">START GAME</button>
<button onclick="restartGame()">RESTART</button>
</div>

<p id="message">Press START GAME to begin!</p>
<p class="hint">Tip: Type the exact word displayed on a balloon.</p>
</main>

<script>
const game=document.getElementById("game");
const input=document.getElementById("input");

const words=[
"apple","school","typing","computer",
"orange","flower","mobile","science",
"planet","coding","expert","dream",
"future","keyboard","website","success",
"learning","practice","student","internet"
];

const colors=[
"#e83e8c","#ff7043","#8e44ad",
"#16a085","#2980b9","#d35400",
"#c0392b","#27ae60"
];

let score=0;
let time=60;
let lives=3;
let combo=0;
let running=false;
let balloons=[];
let spawnTimer;
let clockTimer;
let lastTime=0;
let nextId=0;

function updateStats(){
document.getElementById("score").textContent=score;
document.getElementById("time").textContent=time;
document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
document.getElementById("combo").textContent=combo;
}

function createBalloon(){
if(!running)return;

const word=words[Math.floor(Math.random()*words.length)];
const balloon=document.createElement("div");

balloon.className="balloon";
balloon.textContent=word;
balloon.style.background=colors[Math.floor(Math.random()*colors.length)];

const maxX=Math.max(0,game.clientWidth-85);
balloon.style.left=Math.random()*maxX+"px";
balloon.style.top="100%";

const speed=0.35+Math.random()*0.25+score/1500;

game.appendChild(balloon);

balloons.push({
id:nextId++,
element:balloon,
word:word,
y:game.clientHeight,
speed:speed
});
}

function removeBalloon(balloon){
balloon.element.remove();
balloons=balloons.filter(b=>b!==balloon);
}

function popBalloon(){
const typed=input.value.trim().toLowerCase();
if(!typed)return;

const balloon=balloons.find(b=>b.word===typed);

if(balloon){
removeBalloon(balloon);
score+=10+combo*2;
combo++;
document.getElementById("message").textContent="🎈 POP! Great Typing!";
input.value="";
updateStats();
}else{
document.getElementById("message").textContent="Keep trying...";
}
}

input.addEventListener("input",popBalloon);

function loseLife(){
lives--;
combo=0;
updateStats();
document.getElementById("message").textContent="Missed a balloon!";
if(lives<=0)endGame();
}

function animate(timestamp){
if(!running)return;

const delta=Math.min(timestamp-lastTime,50);
lastTime=timestamp;

for(const balloon of [...balloons]){
balloon.y-=balloon.speed*delta;
balloon.element.style.top=balloon.y+"px";

if(balloon.y<-100){
removeBalloon(balloon);
loseLife();
if(!running)return;
}
}
requestAnimationFrame(animate);
}

function startGame(){
if(running)return;

score=0;
time=60;
lives=3;
combo=0;
balloons.forEach(b=>b.element.remove());
balloons=[];
running=true;
lastTime=performance.now();

document.getElementById("gameOver").style.display="none";
document.getElementById("message").textContent="Game Started! Good Luck!";
input.disabled=false;
input.value="";
input.focus();
updateStats();

spawnTimer=setInterval(createBalloon,1800);

clockTimer=setInterval(()=>{
time--;
updateStats();
if(time<=0)endGame();
},1000);

createBalloon();
requestAnimationFrame(animate);
}

function endGame(){
if(!running)return;
running=false;
clearInterval(spawnTimer);
clearInterval(clockTimer);
input.disabled=true;

document.getElementById("finalScore").textContent=score;
document.getElementById("finalMessage").textContent=
score>=200?"Amazing Performance!":
score>=100?"Great Work!":"Keep Practicing!";

document.getElementById("gameOver").style.display="flex";
}

function restartGame(){
running=false;
clearInterval(spawnTimer);
clearInterval(clockTimer);

balloons.forEach(b=>b.element.remove());
balloons=[];

document.getElementById("gameOver").style.display="none";
input.value="";
input.disabled=true;

score=0;
time=60;
lives=3;
combo=0;
updateStats();

document.getElementById("message").textContent="Press START GAME to begin!";
}

document.getElementById("start").addEventListener("click",startGame);

updateStats();
</script>

</body>
</html>
