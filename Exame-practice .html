
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Practice | AJIT TYPING EXPERT</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#020817;color:#eaf5ff;font-family:Arial,sans-serif}
.container{max-width:850px;margin:25px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
a{color:#00c8ff;text-decoration:none}
h1{color:#00c8ff}
.card{background:#071426;border:1px solid #123b59;border-radius:16px;padding:20px;margin-top:18px}
select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #087fba;background:#020c1c;color:white;font-size:16px}
textarea{height:150px;margin-top:15px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#0b2038;padding:13px;border-radius:10px;text-align:center}
.stat strong{display:block;color:#00d9ff;font-size:23px;margin-top:7px}
button{background:#078bff;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;margin:5px 3px;cursor:pointer}
button:disabled{opacity:.5}
#result{display:none;text-align:center}
#passage{font-size:18px;line-height:1.8;color:#b8d1e8}
#progress{height:8px;background:#142b43;border-radius:10px;overflow:hidden;margin-top:15px}
#bar{height:100%;width:0;background:#00c8ff}
@media(max-width:550px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">

<header>
<strong>AJIT TYPING EXPERT</strong>
<a href="index.html">← Dashboard</a>
</header>

<h1>🎓 Exam Practice</h1>
<p>अपनी Typing Speed और Accuracy को परीक्षा के लिए बेहतर बनाओ।</p>

<div class="card">
<h3>Test Settings</h3>

<label>Exam Category</label>
<select id="category">
<option value="general">General Typing</option>
<option value="ssc">SSC Practice</option>
<option value="railway">Railway Practice</option>
<option value="court">Court Typing</option>
</select>

<br><br>
<label>Test Duration</label>
<select id="duration">
<option value="1">1 Minute</option>
<option value="3">3 Minutes</option>
<option value="5" selected>5 Minutes</option>
<option value="10">10 Minutes</option>
</select>
<br><br>
<button onclick="startExam()" id="startBtn">Start Exam</button>
</div>

<div class="card" id="testArea" style="display:none">
<div class="stats">
<div class="stat">Time<strong id="time">300</strong></div>
<div class="stat">WPM<strong id="wpm">0</strong></div>
<div class="stat">Accuracy<strong id="accuracy">100%</strong></div>
<div class="stat">Errors<strong id="errors">0</strong></div>
</div>

<div id="progress"><div id="bar"></div></div>

<h3>Type the passage:</h3>
<p id="passage"></p>

<textarea id="typing" placeholder="यहाँ टाइप करें..." disabled></textarea>
<p id="message">Start Exam दबाकर टेस्ट शुरू करें।</p>
</div>

<div class="card" id="result">
<h2>🏆 Exam Result</h2>
<div class="stats">
<div class="stat">WPM<strong id="rWpm">0</strong></div>
<div class="stat">Accuracy<strong id="rAccuracy">0%</strong></div>
<div class="stat">Errors<strong id="rErrors">0</strong></div>
<div class="stat">Score<strong id="rScore">0</strong></div>
</div>
<h3 id="remark"></h3>
<button onclick="location.reload()">Take Another Test</button>
</div>

</div>

<script>
const passages={
general:[
"Education is the foundation of a successful life. It gives us knowledge, improves our thinking and helps us understand the world. Every student should develop the habit of reading and learning.",
"Time is very valuable in our life. A person who uses time wisely can achieve many goals. We should make a proper routine and complete our work with honesty and dedication."
],
ssc:[
"India is a democratic country. Every citizen has equal rights and responsibilities. Education, discipline and hard work are important for the progress of our nation.",
"Public services play an important role in the development of a country. Government employees should work honestly and provide support to the people."
],
railway:[
"Railways are an important means of transport in India. They connect cities, towns and villages. Millions of passengers use trains every day for work, education and travel.",
"Safety is the most important part of railway operations. Passengers should follow the rules and listen to official announcements at railway stations."
],
court:[
"Justice is an essential part of a democratic society. Courts protect the rights of citizens and help maintain law and order. Every person should respect the law.",
"The Constitution provides a framework for the administration of justice. Legal institutions must work fairly, honestly and independently."
]
};

let passage="",time=300,total=300,timer=null,started=false,finished=false,startTime=0;

const typing=document.getElementById("typing");

function startExam(){
if(started)return;
const category=document.getElementById("category").value;
const list=passages[category];
passage=list[Math.floor(Math.random()*list.length)];

total=Number(document.getElementById("duration").value)*60;
time=total;

document.getElementById("passage").textContent=passage;
document.getElementById("time").textContent=time;
document.getElementById("testArea").style.display="block";
document.getElementById("startBtn").disabled=true;
typing.disabled=false;
typing.focus();

started=true;
startTime=Date.now();

timer=setInterval(()=>{
time--;
document.getElementById("time").textContent=time;
updateStats();
if(time<=0)endExam();
},1000);
}

function updateStats(){
const value=typing.value;
let correct=0,errors=0;

for(let i=0;i<value.length;i++){
if(value[i]===passage[i])correct++;
else errors++;
}

const elapsed=Math.max((Date.now()-startTime)/60000,1/60);
const wpm=Math.round((correct/5)/elapsed);
const accuracy=value.length?Math.round(correct/value.length*100):100;

document.getElementById("wpm").textContent=wpm;
document.getElementById("accuracy").textContent=accuracy+"%";
document.getElementById("errors").textContent=errors;

let progress=Math.min(value.length/passage.length*100,100);
document.getElementById("bar").style.width=progress+"%";

return {wpm,accuracy,errors,correct};
}

typing.addEventListener("input",()=>{
if(!started||finished)return;
updateStats();
if(typing.value.length>=passage.length)endExam();
});

function endExam(){
if(finished)return;
finished=true;
clearInterval(timer);
typing.disabled=true;

const r=updateStats();
const score=Math.max(0,Math.round(r.wpm*r.accuracy/100));

document.getElementById("testArea").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("rWpm").textContent=r.wpm;
document.getElementById("rAccuracy").textContent=r.accuracy+"%";
document.getElementById("rErrors").textContent=r.errors;
document.getElementById("rScore").textContent=score;

let remark="अच्छा प्रयास! नियमित अभ्यास जारी रखो।";
if(r.accuracy>=95&&r.wpm>=40)remark="शानदार प्रदर्शन!";
else if(r.accuracy<80)remark="Accuracy पर थोड़ा और अभ्यास करो।";
else if(r.wpm<25)remark="Speed बढ़ाने के लिए नियमित अभ्यास करो।";

document.getElementById("remark").textContent=remark;
}
</script>
</body>
</html>
